# Included only in the existing HTTPS server for andromedaweb.store.
location = /wayfinder { return 301 /wayfinder/; }

location ^~ /wayfinder/api/motor/ {
    proxy_pass http://127.0.0.1:3117/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 650s;
    client_max_body_size 400k;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /wayfinder/_next/static/ {
    root /var/www/andromeda;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /wayfinder/ {
    root /var/www/andromeda;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
